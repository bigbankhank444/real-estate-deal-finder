services:
  - type: cron
    name: real-estate-deal-finder
    env: node
    schedule: "0 8 * * *"
    buildCommand: npm install && npx playwright install chromium && npm run migrate
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-deals-db
          property: connectionString
    # All other required env vars must be configured manually in the Render dashboard:
    # OPENROUTER_API_KEY, OPENROUTER_MODEL, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
    # EMAIL_FROM, EMAIL_TO, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM, SMS_TO

databases:
  - name: real-estate-deals-db
    databaseName: real_estate_deals
    plan: free
