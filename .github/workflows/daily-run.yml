name: Daily Real Estate Deal Finder

on:
  # schedule:
  #   - cron: '0 8 * * *'   # 8 AM UTC daily — disabled, re-enable when ready
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Test DB connectivity
        run: |
          PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql \
            -h dpg-d838aje7r5hc73bh02n0-a.oregon-postgres.render.com \
            -p 5432 \
            -U real_estate_deals_user \
            -d real_estate_deals \
            -c "SELECT 1;" \
            --no-password 2>&1 || echo "psql failed with exit $?"
        continue-on-error: true

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL:                    ${{ secrets.DATABASE_URL }}
          NODE_ENV:                        production

      - name: Run deal finder pipeline
        run: node src/index.js
        env:
          DATABASE_URL:                    ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY:              ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL:                ${{ secrets.OPENROUTER_MODEL }}
          SMTP_HOST:                       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:                       ${{ secrets.SMTP_PORT }}
          SMTP_USER:                       ${{ secrets.SMTP_USER }}
          SMTP_PASS:                       ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:                      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:                        ${{ secrets.EMAIL_TO }}
          TWILIO_ACCOUNT_SID:              ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:               ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:                     ${{ secrets.TWILIO_FROM }}
          SMS_TO:                          ${{ secrets.SMS_TO }}
          NODE_ENV:                        production
